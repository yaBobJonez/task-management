name: 'CI pipeline'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: "Stage 1: test"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Отримання репозиторію
        uses: actions/checkout@v6
      
      - name: Встановлення Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: 'true'

      - name: Встановлення GTest
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install -y libgtest-dev

      - name: Встановлення GTest
        if: ${{ runner.os == 'Windows' }}
        run: vcpkg install gtest:x64-windows

      - name: Конфігурація CMake для тестів (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Конфігурація CMake для тестів (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Запуск unit-тестів
        run: |
          cmake --build build --target TaskList_Tests --config Debug --parallel
          ctest --test-dir build/tests -C Debug --output-on-failure --output-junit results.xml

      - name: Відображення результатів тестів
        if: ${{ always() && hashFiles('build/tests/results.xml') != '' }}
        uses: dorny/test-reporter@v2
        with:
          name: Unit-тести (${{ matrix.os }})
          path: build/tests/results.xml
          reporter: java-junit

  build:
    name: "Stage 2: build"
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Отримання репозиторію
        uses: actions/checkout@v6
      
      - name: Встановлення Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: 'true'

      - name: Конфігурація CMake (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF

      - name: Конфігурація CMake (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF

      - name: Збірка проєкту
        run: cmake --build build --target TaskManager --config Release --parallel

      - name: Створення артефакта
        run: |
          cmake -E make_directory artifacts
          cmake --install build --config Release --prefix artifacts

      - name: Збереження артефакта
        uses: actions/upload-artifact@v6
        with:
          name: build-artifact-${{ matrix.os }}
          path: artifacts/
